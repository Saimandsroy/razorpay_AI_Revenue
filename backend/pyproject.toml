[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revenue-recovery-api"
version = "0.1.0"
description = "Test-mode Razorpay revenue recovery API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "google-genai>=1.0,<2.0",
  "razorpay>=1.4,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "setuptools>=70,<82",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
